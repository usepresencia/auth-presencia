name: CI

on:
    push:
        branches: [develop, main]
    pull_request:
        branches: [develop, main]

permissions:
    contents: read

jobs:
    build:
        name: Validate, Lint, Test, Build (NestJS)
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: auth_test
                    POSTGRES_PASSWORD: local-fixture-only
                    POSTGRES_DB: presencia_auth_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U auth_test -d presencia_auth_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - name: Validate commit messages
              if: github.event_name == 'pull_request'
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: npx --no-install commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
            - run: npm run format:check
            - run: npm run lint
            - run: npm run typecheck
            - run: npm run test:coverage
            - run: npm run test:poc
            - run: npm run build
            - run: npm run test:integration
              env:
                  INTEGRATION_DATABASE_URL: postgresql://auth_test:local-fixture-only@127.0.0.1:5432/presencia_auth_test
            - run: npm run docs
