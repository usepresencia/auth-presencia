name: Close linked issue after merge

on:
    pull_request:
        types: [closed]
        branches: [develop]

permissions:
    contents: read
    issues: write

jobs:
    close:
        if: github.event.pull_request.merged == true
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.merge_commit_sha }}
                  persist-credentials: false
            - name: Close the completed issue
              uses: actions/github-script@v7
              with:
                  script: |
                      const { closeLinkedIssue } = require('./scripts/closing-issue.cjs');
                      const result = await closeLinkedIssue({
                        payload: context.payload,
                        repository: context.repo.owner + '/' + context.repo.repo,
                        getIssue: async reference => (await github.rest.issues.get(reference)).data,
                        closeIssue: reference => github.rest.issues.update(reference),
                      });
                      core.info('Issue closure result: ' + result);
