# Postgres local de desenvolvimento. Credenciais sintéticas; não usar fora da sua máquina.
services:
    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: auth
            POSTGRES_PASSWORD: change-me
            POSTGRES_DB: presencia_auth
        ports:
            - '127.0.0.1:55433:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U auth -d presencia_auth']
            interval: 5s
            timeout: 5s
            retries: 20

volumes:
    postgres_data:
