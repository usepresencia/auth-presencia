# Serviço para incluir no docker compose da VPS (/srv/presencia), atrás do Traefik v3.
# As variáveis ficam em .env.auth-presencia, com as de .env.example e AUTH_PRESENCIA_TAG.
services:
    auth-presencia:
        image: ghcr.io/usepresencia/auth-presencia:${AUTH_PRESENCIA_TAG}
        restart: unless-stopped
        env_file: .env.auth-presencia
        labels:
            - traefik.enable=true
            # Somente os caminhos da API; o restante do domínio fica para o front.
            - 'traefik.http.routers.auth-api.rule=Host(`auth.presencia.com.br`) && (PathRegexp(`^/(\.well-known|jwks|authorize|token|session|health)(/|$$)`) || PathRegexp(`^/interaction/[^/]+/.+`))'
            - traefik.http.routers.auth-api.entrypoints=websecure
            - traefik.http.routers.auth-api.tls.certresolver=letsencrypt
            - traefik.http.services.auth-api.loadbalancer.server.port=3340
        healthcheck:
            test:
                - CMD
                - node
                - -e
                - "fetch('http://127.0.0.1:3340/health/ready').then(r => process.exit(r.ok ? 0: 1), () => process.exit(1))"
            interval: 30s
            timeout: 5s
            retries: 3
